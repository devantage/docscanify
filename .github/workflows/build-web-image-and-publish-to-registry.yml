name: Build Web App image and publish to registry

on:
  push:
    tags:
      - 'web-v*.*.*'

jobs:
  build_and_publish:
    name: Build image and publish to registry
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_ORG: ${{ github.event.repository.owner.login }}
      IMAGE_NAME: ${{ github.event.repository.name }}

    steps:
      - id: checkout_repository
        name: Checkout repository
        uses: actions/checkout@v5

      - id: get_version
        name: Get image version
        run: |
          VERSION=$(jq .version apps/web/package.json -r)

          # The tag must match the version of the app, so the image is never published under the wrong one
          if [ "${GITHUB_REF_NAME}" != "web-v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/web/package.json version ${VERSION} (expected web-v${VERSION})"

            exit 1
          fi

          IMAGE_ID=${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/${{ env.IMAGE_NAME }}/web

          # Changes all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "image_id=${IMAGE_ID}" >> $GITHUB_OUTPUT

      # Emulates arm64 on the amd64 runner, and buildx builds both platforms into one image
      - id: setup_qemu
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - id: setup_buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: authenticate_on_registry
        name: Authenticate on registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - id: build_and_push_image
        name: Build image and push to registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.get_version.outputs.image_id }}:${{ steps.get_version.outputs.version }}
            ${{ steps.get_version.outputs.image_id }}:stable
            ${{ steps.get_version.outputs.image_id }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
