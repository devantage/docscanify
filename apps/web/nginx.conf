server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # opencv.js (about 9 MB) goes down to about 3.5 MB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed by Vite: a new version of a file always has a new name
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Checked on every visit, so the app finds new versions. The service worker keeps the files
    # for offline use, so revalidating them costs only a request
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # One web app manifest per language
    location ~ \.webmanifest$ {
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
